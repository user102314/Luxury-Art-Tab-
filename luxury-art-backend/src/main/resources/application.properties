spring.application.name=luxury-art-backend
server.port=8081

# Dev local par défaut. Sur le VPS : SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=local

# Origins CORS (surchargées en prod via APP_CORS_ALLOWED_ORIGINS)
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:8080,http://localhost:8081,http://localhost:8082,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://127.0.0.1:8080,http://127.0.0.1:8081,http://127.0.0.1:8082

# =============================================================================
# Supabase PostgreSQL — valeurs par défaut (surchargées en local)
# =============================================================================
spring.datasource.url=jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres.aucdppanjchtodiorrlf
spring.datasource.password=${SUPABASE_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

spring.h2.console.enabled=false

# Images produits stockées localement dans ./uploads/ (servies via /uploads/**)
# Chemin absolu recommandé pour éviter les 404 si le cwd Maven/IDE change
app.uploads.dir=${user.dir}/uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# =============================================================================
# Colissimo — synchronisation automatique des colis externes
# Identifiants API dans application-local.properties (non versionné)
# =============================================================================
colissimo.enabled=false
colissimo.endpoint=https://delivery.colissimo.com.tn/wsColissimoGo/wsColissimoGo.asmx
colissimo.sync-interval-ms=300000
colissimo.sync-initial-delay-ms=30000
