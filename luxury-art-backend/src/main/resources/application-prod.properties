# =============================================================================
# Profil PRODUCTION — VPS
# Lancer : SPRING_PROFILES_ACTIVE=prod java -jar luxury-art-backend-1.0.0.jar
#
# Datasource via env Spring Boot (ne PAS écrire ${SPRING_DATASOURCE_USERNAME}
# ici : collision avec le binding → user vide → "postgres") :
#   SPRING_DATASOURCE_URL
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
# =============================================================================

server.port=${SERVER_PORT:8081}

spring.datasource.driver-class-name=org.postgresql.Driver

# Prod : pas de SQL verbeux. ddl-auto surchargeable.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.h2.console.enabled=false

app.uploads.dir=${APP_UPLOADS_DIR:/opt/luxury-art/uploads}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

colissimo.enabled=${COLISSIMO_ENABLED:false}
colissimo.endpoint=${COLISSIMO_ENDPOINT:https://delivery.colissimo.com.tn/wsColissimoGo/wsColissimoGo.asmx}
colissimo.utilisateur=${COLISSIMO_UTILISATEUR:}
colissimo.pass=${COLISSIMO_PASS:}
colissimo.sync-interval-ms=${COLISSIMO_SYNC_INTERVAL_MS:300000}
colissimo.sync-initial-delay-ms=${COLISSIMO_SYNC_INITIAL_DELAY_MS:60000}
